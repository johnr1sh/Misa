name: Extract carm archive

on:
  push:
    paths:
      - '.github/workflows/unzip-carm.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract archive safely
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os

          archive = Path("carm.zip")
          if not archive.is_file():
              raise SystemExit("carm.zip was not found at repository root")

          root = Path.cwd().resolve()
          with ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
                  if name.startswith(".git/") or name == ".git":
                      raise SystemExit("Archive contains a .git path")
              z.extractall(root)
          PY
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: extract carm.zip"
            git push origin HEAD:main
          else
            echo "No extracted changes to commit."
          fi
